name: fetch card

on:
  schedule:
    - cron: "23 21 * * *" # daily, 02:53 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/fetch.yml"

permissions:
  contents: write

concurrency:
  group: fetch-card
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Render assets/fetch.svg
        run: python3 scripts/fetch_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if it changed
        run: |
          if git diff --quiet -- assets/fetch.svg; then
            echo "fetch card unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fetch.svg
          git commit -m "chore(fetch): refresh card"
          git push
